<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

    <main class="login-main">

        <div id="login-box">

            <div class="login-image"></div>

            <div class="login-content">
                <h1>SIGN IN</h1>
                <div class="line"></div>
                <p class="instruction">Please enter your emil and passsword below to sign in.</p>

                <form class="login-form">
                    <div id="email-field" class="form-field">
                        <input type="text" name="email" placeholder="Email">
                    </div>

                    <div id="password-field" class="form-field">
                        <input type="password" name="password" placeholder="Password">
                    </div>

                    <div id="remember-row">
                        <label><input type="checkbox" name="remember"> Remember Me</label>
                        <a href="#" class="plain-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">SIGN IN</button>
                </form>

                <p class="register">Don't have an account? <a href="signup.html">Register</a></p>
                <a href="#" class="plain-link">Log in with Facebook</a>
            </div>

        </div>

    </main>

    <footer class="login-footer">
        <p>Finora <br>Learn. Care. Explore.</p>
    </footer>

</body>
</html>
