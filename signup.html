<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

    <main class="login-main">

        <div id="login-box">


            <div class="login-image"></div>

            <div class="login-content">
                <h1>SIGN UP</h1>
                <div class="line"></div>

                <form class="login-form">
                    <div id="name-field" class="form-field">
                        <input type="text" name="fullname" placeholder="Full Name">
                    </div>

                    <div id="email-field" class="form-field">
                        <input type="text" name="email" placeholder="Email">
                    </div>

                    <div id="password-field" class="form-field">
                        <input type="password" name="password" placeholder="Password">
                    </div>

                    <div id="confirm-password-field" class="form-field">
                        <input type="password" name="confirm_password" placeholder="Confirm Password">
                    </div>

                    <div id="remember-row">
                        <label><input type="checkbox" name="terms"> I agree to the Terms &amp; Conditions</label>
                    </div>

                    <button type="submit" class="submit-btn">SIGN UP</button>
                </form>

                <p class="register">Already have an account? <a href="login.html">Login</a></p>
                <a href="#" class="plain-link">Sign up with Facebook</a>
            </div>

        </div>

    </main>

    <footer class="login-footer">
        <p>Finora Guide <br>Learn. Care. Explore.</p>
    </footer>

</body>
</html>
